name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 5. Ejecutar pruebas unitarias
      - name: Run unit tests
        run: npm test -- --watch=false

      # 6. Generar build de Angular
      - name: Build Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # 7. Configurar fallback para SPA
      - name: Configure GitHub Pages fallback
        run: cp ./dist/dev-portfolio-explorer/browser/index.html ./dist/dev-portfolio-explorer/browser/404.html

      # 8. Subir artefacto
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/dev-portfolio-explorer/browser

  # 9. Desplegar
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
         uses: actions/deploy-pages@v4
